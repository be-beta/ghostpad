<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostPad</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Camada que escurece o que esta atras da janela. A opacidade do usuario
         mexe aqui: animar CSS nao pisca. -->
    <div class="gp-backdrop" id="backdrop"></div>

    <div class="gp-shell">
      <!-- Topo: abas a esquerda e o resto da faixa serve para arrastar, o que
           aproveita um espaco que ja existia. As pontas ficam livres para as
           alcas de redimensionamento. -->
      <div class="gp-topbar">
        <span class="gp-tabs" id="tabs"></span>
        <div class="gp-topbar__drag" data-drag data-i18n-title="window.drag"></div>
      </div>

      <!-- Controles que so aparecem quando o mouse chega perto. -->
      <div class="gp-controls" id="controls">
        <!-- Alca de arraste: sem barra de titulo, nada mais indica que a janela
             pode ser movida. Arrastar por aqui e pela faixa do topo funciona igual. -->
        <div class="gp-btn gp-btn--grip" data-drag data-i18n-title="window.drag" data-i18n-aria="window.move">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="6" r="1.4" /><circle cx="15" cy="6" r="1.4" />
            <circle cx="9" cy="12" r="1.4" /><circle cx="15" cy="12" r="1.4" />
            <circle cx="9" cy="18" r="1.4" /><circle cx="15" cy="18" r="1.4" />
          </svg>
        </div>
        <button class="gp-btn" id="btn-minimize" data-i18n-title="window.minimize" data-i18n-aria="window.minimize">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
        <button class="gp-btn gp-btn--danger" id="btn-close" data-i18n-title="window.close" data-i18n-aria="window.close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>

      <main class="gp-editor-wrap">
        <div id="editor" class="gp-editor"></div>
      </main>

      <footer class="gp-status" id="status" data-drag>
        <div class="gp-status__group">
          <button class="gp-chip" id="chip-ontop" data-active="true" data-i18n-title="chip.onTop.title">
            <span class="gp-chip__dot"></span><span class="gp-chip__label" data-i18n="chip.onTop"></span>
          </button>
          <button class="gp-chip" id="chip-ghost" data-i18n-title="chip.ghost.title">
            <span class="gp-chip__dot"></span><span class="gp-chip__label" data-i18n="chip.ghost"></span>
          </button>
          <button class="gp-chip" id="chip-stealth" data-i18n-title="chip.stealth.title">
            <span class="gp-chip__dot"></span><span class="gp-chip__label" data-i18n="chip.stealth"></span>
          </button>

        </div>

        <div class="gp-status__group gp-status__group--right">
          <button class="gp-chip" id="chip-backdrop" data-i18n-title="chip.backdrop.title"></button>
          <span class="gp-metrics" id="metrics"></span>
          <button class="gp-metric gp-metric--dim" id="metric-opacity" data-i18n-title="chip.opacity.title">90%</button>
          <span class="gp-fontsize" id="fontsize">
            <button class="gp-fontsize__btn" id="font-smaller" data-i18n-title="chip.fontSize.smaller">A−</button>
            <span class="gp-fontsize__value" id="font-size-value">15</span>
            <button class="gp-fontsize__btn" id="font-bigger" data-i18n-title="chip.fontSize.bigger">A+</button>
          </span>
          <button class="gp-chip gp-chip--icon" id="chip-settings" data-i18n-title="chip.settings.title">⚙</button>
          <button class="gp-chip gp-chip--icon" id="chip-modules" data-i18n-title="chip.modules.title">⋯</button>
          <button class="gp-chip gp-chip--icon" id="chip-help" data-i18n-title="chip.help.title">?</button>
        </div>
      </footer>
    </div>

    <!-- Marca o ponto de leitura no teleprompter. -->
    <div class="gp-focusline" aria-hidden="true"></div>

    <!-- Controles do teleprompter: aparecem ao aproximar o mouse. Existem porque
         ninguem deve ficar preso num modo por nao ter decorado um atalho. -->
    <div class="gp-prompter" id="prompter" hidden>
      <button class="gp-prompter__btn" data-prompter="pause" data-i18n-title="prompter.playPause">
        <span id="prompter-play">▶</span>
      </button>
      <span class="gp-prompter__speed" id="prompter-speed">25</span>
      <button class="gp-prompter__btn gp-prompter__btn--extra" data-prompter="slower" data-i18n-title="prompter.slower">−</button>
      <button class="gp-prompter__btn gp-prompter__btn--extra" data-prompter="faster" data-i18n-title="prompter.faster">+</button>
      <button class="gp-prompter__btn gp-prompter__btn--extra gp-prompter__btn--exit" data-prompter="exit" data-i18n-title="prompter.exit">✕</button>
    </div>

    <!-- Historico de versoes (Ctrl+Shift+V). Conteudo em src/ui/history.ts. -->
    <div class="gp-sheet" id="history" hidden></div>

    <!-- Menu de modulos da barra. Conteudo gerado em src/main.ts. -->
    <div class="gp-menu" id="modules" hidden></div>

    <!-- Configuracoes (Ctrl+,). Conteudo em src/ui/settings.ts. -->
    <div class="gp-sheet" id="settings" hidden></div>

    <!-- Painel de atalhos (Ctrl+/). Conteudo gerado em src/ui/shortcuts.ts. -->
    <div class="gp-sheet" id="shortcuts" hidden></div>

    <!-- Alcas de redimensionamento. A borda nativa de uma janela sem moldura tem
         poucos pixels; estas ampliam a area sem mudar a aparencia. -->
    <div class="gp-resize gp-resize--n" data-resize="North"></div>
    <div class="gp-resize gp-resize--s" data-resize="South"></div>
    <div class="gp-resize gp-resize--e" data-resize="East"></div>
    <div class="gp-resize gp-resize--w" data-resize="West"></div>
    <div class="gp-resize gp-resize--nw" data-resize="NorthWest"></div>
    <div class="gp-resize gp-resize--ne" data-resize="NorthEast"></div>
    <div class="gp-resize gp-resize--sw" data-resize="SouthWest"></div>
    <div class="gp-resize gp-resize--se" data-resize="SouthEast"></div>

    <!-- Avisos efemeros. Existe porque alguns estados (invisivel em gravacao,
         modo fantasma) sao invisiveis por natureza e precisam de confirmacao. -->
    <div class="gp-toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
